_schema-version: "3.2"
ID: vera-fiori
description: Versant Vendor Workzone
version: 1.0.0
modules:
- name: vera-fiori-approuter
  type: approuter.nodejs
  path: approuter
  requires:
  - name: vera-fiori-destination-service
  - name: vera-connectivity
  - name: vera-fiori-uaa
  parameters:
    disk-quota: 256M
    memory: 256M
- name: vera-fiori-destination-content
  type: com.sap.application.content
  requires:
  - name: vera-fiori-destination-service
    parameters:
      content-target: true
  - name: vera-fiori-repo-host
    parameters:
      service-key:
        name: vera-fiori-repo-host-key
  - name: vera-fiori-uaa
    parameters:
      service-key:
        name: vera-fiori-uaa-key
  parameters:
    content:
      instance:
        destinations:
        - Name: vera_html_repo_host
          ServiceInstanceName: vera-html5-service
          ServiceKeyName: vera-fiori-repo-host-key
          sap.cloud.service: vsnt.vera
        - Authentication: OAuth2UserTokenExchange
          Name: vera_uaa
          ServiceInstanceName: vera-xsuaa-service
          ServiceKeyName: vera-fiori-uaa-key
          sap.cloud.service: vsnt.vera
        existing_destinations_policy: update
  build-parameters:
    no-source: true
- name: vera-fiori-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: vera-fiori-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - vsnt.vera.zip
      name: vera-fiori
      target-path: resources/
- name: vera-fiori
  type: html5
  path: .
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: vera-fiori-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          - Authentication: NoAuthentication
            Name: VeRA_Backend
            ProxyType: Internet
            Type: HTTP
            URL: ${backend-url}
            #URL: https://nbcuniversal-media--llc-versant-cf-bwz-dev-use-75tfnrq659c99ec0.cfapps.us10-001.hana.ondemand.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: vera-destination-service
    service-plan: lite
- name: vera-connectivity
  type: org.cloudfoundry.managed-service
  parameters:
    service: connectivity
    service-name: vera-connectivity-service
    service-plan: lite
- name: vera-fiori-uaa
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-name: vera-xsuaa-service
    service-plan: application
- name: vera-fiori-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: vera-html5-service
    service-plan: app-host
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
  #backend-url: https://nbcuniversal-media--llc-versant-cf-bwz-dev-use-75tfnrq659c99ec0.cfapps.us10-001.hana.ondemand.com
