# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: vsnt.vera
type: application
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
      - /index-mock.html
      - /node_modules/**
      - /package.json
      - /package-lock.json
  minification:
    excludes:
      - "**/node_modules/**"
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: vsnt.vera
        relativePaths: true
        additionalFiles:
          - xs-app.json
