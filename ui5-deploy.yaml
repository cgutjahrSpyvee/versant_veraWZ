# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: vsnt.vera
type: application
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
      - /index-mock.html
      - /node_modules/**
      - /package.json
      - /package-lock.json
  minification:
    excludes:
      - "**/node_modules/**"
  customTasks:
    # Stamps a unique applicationVersion into the built manifest so every deploy
    # lands on a new Work Zone URL segment and no browser can serve a stale
    # index.html. Must precede generateComponentPreload — manifest.json is
    # bundled into Component-preload.js.
    - name: stamp-app-version
      beforeTask: generateComponentPreload
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: vsnt.vera
        relativePaths: true
        additionalFiles:
          - xs-app.json
---
specVersion: "4.0"
kind: extension
type: task
metadata:
  name: stamp-app-version
task:
  path: lib/tasks/stampAppVersion.js
