specVersion: "3.0"
metadata:
  name: vsnt.vera
type: application

builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"
      - "/index-mock.html"

---
specVersion: "3.0"
kind: extension
metadata:
  name: deploy-to-cf
type: project-shim
shims:
  configurations:
    fiori-tools-deploy-config:
      appId: vsnt.vera
      appName: vsnt.vera
      appVersion: 1.0.0
      targetPlatform: CloudFoundry
      destination:
        name: vera-html5-host
      routing:
        routes:
          - route: vsnt-vera-${org}-${space}.${default-domain}
