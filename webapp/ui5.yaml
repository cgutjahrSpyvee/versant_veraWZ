specVersion: "3.0"
metadata:
  name: vsnt.vera
type: application

framework:
  name: SAPUI5
  version: "1.120.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.f
    - name: sap.ui.unified
    - name: sap.ushell
    - name: sap.ui.fl

# Local run config (BAS):
# When you click Run / Preview in BAS, fiori-tools-proxy reads the
# destination name and uses BTP destination VERA_PORTAL to tunnel API
# calls through to the on-premise portal via Cloud Connector.
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        backend:
          - path: /vera-portal
            destination: VERA_PORTAL
            pathReplace: ""
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com

builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"
      - "/index-mock.html"
